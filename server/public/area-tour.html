<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'" />
  <title>Respawn · Tour</title>
  <link rel="stylesheet" href="/css/style.css?v=55" />
  <link rel="stylesheet" href="/css/domains.css?v=10" />
  <link rel="stylesheet" href="/css/overlays.css?v=5" />
</head>
<body class="area-tour-demo-page">
  <div id="app" class="app">
    <header class="topbar">
      <a class="topbar-title" href="/" aria-label="Zur Landingpage">
        <span class="topbar-logo-wrap">
          <img class="topbar-logo" src="/img/logo.svg" alt="" width="30" height="30" />
          <span id="admin-indicator" class="admin-indicator" title="Admin-Modus an" hidden></span>
        </span>
        <span class="brand-title">Respawn</span>
        <span id="admin-indicator-label" class="admin-indicator-label" hidden>Admin</span>
      </a>
      <div class="topbar-actions">
        <!-- app.js renders the shared searchable event dropdown in here. -->
        <div id="event-context" class="event-context" hidden></div>
        <button id="info-btn" class="icon-btn" type="button" aria-label="Info: WLAN, Discord, Server und Hausregeln" title="Info"></button>
        <button id="global-search-btn" class="icon-btn" type="button" aria-label="Bereiche und Tools durchsuchen" aria-keyshortcuts="Control+K Meta+K" title="Suchen (Strg/⌘ K)"></button>
        <div class="notification-center" data-notification-center>
          <button id="notifications-btn" class="icon-btn" aria-label="Mitteilungen" aria-controls="notifications-panel" aria-expanded="false" title="Mitteilungen">
            <span id="notifications-count" class="notification-count" hidden></span>
          </button>
          <div id="notifications-panel" class="notification-center-panel" role="region" aria-label="Mitteilungen" hidden></div>
        </div>
        <button id="feedback-btn" class="icon-btn" type="button" aria-label="Feedback geben" title="Feedback"></button>
      </div>
    </header>

    <aside id="notification-highlight" class="notification-highlight" aria-label="Aktuelle Mitteilung" hidden></aside>

    <aside id="connection-status" class="connection-status" role="status" aria-live="polite" hidden></aside>

    <main id="view-container" class="view-container"></main>

    <nav class="desktop-nav" aria-label="Desktop-Navigation">
      <div id="desktop-nav-main" class="desktop-nav-main"></div>
      <div id="desktop-nav-utilities" class="desktop-nav-utilities"></div>
    </nav>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <div class="bottom-nav-inner">
        <button class="nav-btn" data-nav-slot="0" data-view="home" aria-label="Home">
          <span class="nav-icon" data-domain-icon="home"></span><span class="nav-label">Home</span>
        </button>
        <button class="nav-btn" data-nav-slot="1" data-view="matchmaking" aria-label="Match: Teams und Turniere">
          <span class="nav-icon" data-domain-icon="competition"></span><span class="nav-label">Match</span>
        </button>
        <button class="nav-btn" data-nav-slot="2" data-view="votes" aria-label="Abstimmung">
          <span class="nav-icon" data-domain-icon="votes"></span><span class="nav-label">Vote</span>
        </button>
        <!-- Auswertung (Rangliste/Statistiken/Hall of Fame) lives in Admin's
             Werkzeuge now (see views/admin.js), not in the bottom nav. -->
        <button class="nav-btn" data-nav-slot="3" data-view="foodOrders" aria-label="Essen: Sammelbestellungen koordinieren" id="nav-food-orders">
          <span class="nav-icon" data-domain-icon="foodOrders"></span><span class="nav-label">Essen</span>
        </button>
        <button class="nav-btn" data-nav-slot="4" data-view="gameCatalog" aria-label="Spiele">
          <span class="nav-icon" data-domain-icon="gameCatalog"></span><span class="nav-label">Spiele</span>
        </button>
        <button class="nav-btn" data-nav-slot="5" data-view="more" aria-label="Mehr">
          <span class="nav-icon" data-domain-icon="more"></span><span class="nav-label">Mehr</span>
        </button>
      </div>
    </nav>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="/js/areaTourDemo.js"></script>
</body>
</html>
