<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1420" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Respawn" />
  <title>Respawn</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
  <!-- PNG fallback for browsers/bookmark features that can't use an SVG favicon
       (e.g. Firefox on iOS, whose "Add to Home Screen" is a plain bookmark
       shortcut with no manifest/apple-touch-icon support). -->
  <link rel="icon" type="image/png" sizes="192x192" href="/img/logo-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <!-- bump ?v= when the stylesheet changes so no cached copy survives a reload -->
  <link rel="stylesheet" href="/css/style.css?v=40" />
  <!-- app.js adds this sheet only while an Arcade view is active. -->
</head>
<body>
  <!-- Login/register/claim content is rendered by authGate.js because the
       applicable form depends on the invite, claim or reset URL. -->
  <div id="auth-screen" class="login-screen" hidden></div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <a class="topbar-title" href="/" aria-label="Zur Landingpage">
        <img class="topbar-logo" src="/img/logo.svg" alt="" width="30" height="30" />
        <span class="brand-title">Respawn</span>
      </a>
      <div class="topbar-actions">
        <button id="info-btn" class="icon-btn" type="button" aria-label="Info: WLAN, Discord, Server und Hausregeln" title="Info"></button>
        <div id="event-context" class="event-context" hidden>
          <span id="event-context-status" class="event-context-status" aria-hidden="true"></span>
          <select id="event-context-switcher" class="event-context-switcher" aria-label="Aktives Event"></select>
        </div>
        <button id="global-search-btn" class="icon-btn" type="button" aria-label="Bereiche und Tools durchsuchen" aria-keyshortcuts="Control+K Meta+K" title="Suchen (Strg/⌘ K)"></button>
        <div class="notification-center" data-notification-center>
          <button id="notifications-btn" class="icon-btn" aria-label="Mitteilungen" aria-controls="notifications-panel" aria-expanded="false" title="Mitteilungen">
            <span id="notifications-count" class="notification-count" hidden></span>
          </button>
          <div id="notifications-panel" class="notification-center-panel" role="region" aria-label="Mitteilungen" hidden></div>
        </div>
        <button id="profile-btn" class="icon-btn" aria-label="Mein Profil" title="Mein Profil"></button>
      </div>
    </header>

    <aside id="notification-highlight" class="notification-highlight" aria-label="Aktuelle Mitteilung" hidden></aside>

    <aside id="connection-status" class="connection-status" role="status" aria-live="polite" hidden></aside>

    <div id="admin-banner" class="admin-banner" hidden>
      <span class="admin-banner-label">
        Admin-Modus aktiv – Test-Spieler sichtbar
      </span>
      <button type="button" id="admin-banner-leave" class="btn btn-sm">Verlassen</button>
    </div>

    <main id="view-container" class="view-container"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <div class="bottom-nav-inner">
        <button class="nav-btn" data-view="home" aria-label="Home">
          <span class="nav-icon" data-domain-icon="home"></span><span class="nav-label">Home</span>
        </button>
        <button class="nav-btn" data-view="matchmaking" aria-label="Match: Teams und Turniere">
          <span class="nav-icon" data-domain-icon="competition"></span><span class="nav-label">Match</span>
        </button>
        <button class="nav-btn" data-view="votes" aria-label="Abstimmung">
          <span class="nav-icon" data-domain-icon="votes"></span><span class="nav-label">Vote</span>
        </button>
        <button class="nav-btn" data-view="leaderboard" aria-label="Auswertung: Rangliste, Statistiken und Hall of Fame">
          <span class="nav-icon" data-domain-icon="insights"></span><span class="nav-label">Auswertung</span>
        </button>
        <button class="nav-btn" data-view="gameCatalog" aria-label="Spiele">
          <span class="nav-icon" data-domain-icon="gameCatalog"></span><span class="nav-label">Spiele</span>
        </button>
        <button class="nav-btn" data-view="more" aria-label="Mehr">
          <span class="nav-icon" data-domain-icon="more"></span><span class="nav-label">Mehr</span>
        </button>
      </div>
    </nav>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div id="onboarding-root"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
