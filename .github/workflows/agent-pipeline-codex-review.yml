name: Agent pipeline Codex cross-review

# Requests exactly one native Codex review after the user chooses `review:cross` for a Claude
# implementation. The trusted default branch decides eligibility and posts only the review request;
# Codex owns the actual head-bound GitHub review and the reconciler owns the merge gate.

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to re-evaluate
        required: true
        type: number

permissions:
  contents: read

concurrency:
  # Serialize request decisions per pull request. The exact-head marker makes a duplicate no-op
  # even when a label event and a manual dispatch overlap.
  group: agent-pipeline-codex-review-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  select:
    name: Select Codex review target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_request: ${{ steps.select.outputs.pull_request }}
    steps:
      - name: Select pull request
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          MANUAL_PR: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          selected=""
          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            if [[ "${EVENT_LABEL}" == "review:cross" ]]; then
              selected="${EVENT_PR}"
            fi
          else
            selected="${MANUAL_PR}"
          fi
          if [[ -n "${selected}" && ! "${selected}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Pull request must be a positive integer." >&2
            exit 1
          fi
          echo "pull_request=${selected}" >> "$GITHUB_OUTPUT"
          echo "Selected pull request: ${selected:-none}"

  request:
    name: Request Codex cross-review
    needs: select
    if: needs.select.outputs.pull_request != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: write
      statuses: read
    outputs:
      should_run: ${{ steps.request.outputs.should_run }}
      code: ${{ steps.request.outputs.code }}
      reason: ${{ steps.request.outputs.reason }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      requested: ${{ steps.request.outputs.requested }}
    steps:
      - name: Check out trusted pipeline code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Request native Codex review
        id: request
        shell: bash
        env:
          # Reads only. Every write this workflow performs is a review request, and the job token
          # cannot perform it: the Codex integration refuses `@codex review` from
          # `github-actions[bot]` and answers with a connector hint instead of a review.
          GITHUB_TOKEN: ${{ github.token }}
          # The only credential that posts the request, and deliberately without a fallback to
          # `github.token`. Without this secret the adapter posts nothing and reports a failed
          # review attempt, so the pull request says so instead of waiting for a refused request.
          AGENT_PIPELINE_REVIEW_REQUEST_TOKEN: ${{ secrets.AGENT_PIPELINE_REVIEW_REQUEST_TOKEN }}
          AGENT_PIPELINE_DISABLED: ${{ vars.AGENT_PIPELINE_DISABLED }}
          REPOSITORY: ${{ github.repository }}
          SELECTED_PR: ${{ needs.select.outputs.pull_request }}
        run: |
          node scripts/agent-codex-review.mjs request \
            --repository "${REPOSITORY}" \
            --pr "${SELECTED_PR}"

      # The adapter exits cleanly so its outputs stay readable for the notice job. A chosen review
      # that never reached Codex is still a failed run and must be red in the checks list.
      - name: Fail when the chosen review was not requested
        if: steps.request.outputs.should_run == 'true' && steps.request.outputs.requested != 'true'
        shell: bash
        env:
          REQUEST_CODE: ${{ steps.request.outputs.code }}
          REQUEST_REASON: ${{ steps.request.outputs.reason }}
        run: |
          echo "No Codex review request is outstanding for this head (${REQUEST_CODE}): ${REQUEST_REASON}" >&2
          exit 1

  notice:
    name: Announce missing Codex cross-review
    needs: [select, request]
    # Runs whenever a chosen cross-review never reached Codex: the missing request credential, a
    # refused request, a decline, or a job that failed before any request existed. Without it the
    # pull request keeps waiting on a review that will never start, and the reconciler can only
    # report the symptom.
    if: >-
      always() && needs.select.outputs.pull_request != '' &&
      (needs.request.result == 'failure' || needs.request.outputs.requested != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted notice code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Announce that no review request reached Codex
        shell: bash
        env:
          # The notice only reports state, so the job token is the right identity for it.
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ needs.select.outputs.pull_request }}
          HEAD_SHA: ${{ needs.request.outputs.head_sha }}
          OUTCOME: ${{ needs.request.outputs.should_run == 'false' && 'declined' || 'failed' }}
          # A failed job may never have reached the dispatch, so its code and reason can be empty.
          CODE: ${{ needs.request.outputs.code || 'failed' }}
          REASON: ${{ needs.request.outputs.reason || 'the review-request job failed before a request existed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/agent-codex-review.mjs notice \
            --repository "${REPOSITORY}" \
            --pr "${PULL_NUMBER}" \
            --head-sha "${HEAD_SHA}" \
            --outcome "${OUTCOME}" \
            --code "${CODE}" \
            --reason "${REASON}" \
            --run-url "${RUN_URL}"
